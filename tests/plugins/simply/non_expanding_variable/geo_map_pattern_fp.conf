# Official allowlisting pattern: geo classifies, map expands
http {
  geo $limit {
    default 1;
    127.0.0.1 0;
    10.0.0.0/8 0;
    proxy 192.0.2.1;
    delete 10.1.0.0/16;
  }
  map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
  }
  limit_req_zone $limit_key zone=dynamic:10m rate=5r/s;
  split_clients "${remote_addr}AAA" $variant {
    50% a;
    * "b";
  }
  geo $remote_addr $price {
    default "$5";
    ranges;
  }
}
