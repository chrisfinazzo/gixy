http {
  map $http_x_api $UPSTREAM_KEY { default a; }
  server {
    server_name example.com *.example.org ~^(?<sub>.+)\.example\.net$;
    set $API_URL http://127.0.0.1:8080;
    location ~ \.php$ { return 200; }
    location ~* ^/(foo|bar)/?$ { return 200; }
    location ~ ^/a[$]b { return 200; }
    location ~ "^/price\$usd" { return 200; }
    location @fallback { return 200; }
    location /auth { auth_request /auth-check; proxy_pass $API_URL; }
    location /h { add_header X-Key $UPSTREAM_KEY; add_header X-Host $HOST; return 200; }
    rewrite ^/(.*)$ /x/$1 last;
    if ($request_uri ~ "^/x$") { return 200; }
    if ($a = $b) { return 200; }
  }
}
